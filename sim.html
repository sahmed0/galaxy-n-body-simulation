    <meta charset="UTF-8" />

    <title>N-Body Simulation | Sajid Ahmed</title>
    <meta name="title" content="N-Body Simulation">
    <meta name="description" content="A high-performance interactive N-body simulation — a self-gravitating spiral galaxy and an SMBH accretion disk — built with WebGPU and WGSL.">

    <meta property="og:type" content="website">
    <meta property="og:url" content="https://galaxy.sajidahmed.co.uk/sim.html">
    <meta property="og:title" content="N-Body Simulation">
    <meta property="og:description"
        content="Witness the gravity of thousands of stars in real-time using modern WebGPU technology.">
    <meta property="og:image" content="https://galaxy.sajidahmed.co.uk/preview.png">

    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://galaxy.sajidahmed.co.uk/sim.html">
    <meta property="twitter:title" content="N-Body Simulation">
    <meta property="twitter:description" content="Interactive N-body astrophysics simulation powered by WebGPU.">
    <meta property="twitter:image" content="https://galaxy.sajidahmed.co.uk/preview.png">
</head>

<body>
    <!-- Mobile Toggles -->
    <button id="ui-toggle-telemetry" class="mobile-toggle tactical-glass" title="Toggle Telemetry">i</button>
    <button id="ui-toggle-controls" class="mobile-toggle tactical-glass" title="Toggle Controls"><svg
            xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"
            aria-hidden="true">
            <path
                d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.49.49 0 0 0-.48-.41h-3.84a.49.49 0 0 0-.48.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.49.49 0 0 0-.59.22L2.74 8.87a.49.49 0 0 0 .12.61l2.03 1.58c-.05.3-.07.62-.07.94 0 .32.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.13.22.39.31.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.48-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.09.47 0 .59-.22l1.92-3.32a.49.49 0 0 0-.12-.61l-2.01-1.58zM12 15.6A3.6 3.6 0 1 1 12 8.4a3.6 3.6 0 0 1 0 7.2z" />
        </svg></button>

    <!-- Control Island -->
    <nav id="control-island" class="tactical-glass">
        <button id="ui-toggle-pin" class="tactical-button pin-button" title="Toggle UI Pin">📌</button>
        <div class="control-group">
            <label for="ui-engine">Physics Engine</label>
            <select id="ui-engine" class="tactical-select">
                <option value="brute">CPU: Brute Force</option>
                <option value="barnes">CPU: Barnes-Hut</option>
                <option value="worker">CPU: Barnes-Hut (Worker)</option>
                <option value="webgpu">GPU: WebGPU</option>
            </select>
        </div>
        <div class="control-group" id="ui-quadtree-group" style="display: none;">
            <label>&nbsp;</label>
            <div style="display: flex; align-items: center; height: 100%;">
                <input type="checkbox" id="ui-show-grid" class="tactical-input" style="width: auto; margin-right: 5px;">
                <label for="ui-show-grid"
                    style="margin: 0; cursor: pointer; text-transform: none; color: white;">QuadTree</label>
            </div>
        </div>
        <div class="control-group">
            <label for="ui-preset">Simulation Preset</label>
            <select id="ui-preset" class="tactical-select">
                <option value="galaxy">Galaxy (spiral)</option>
                <option value="accretion">Accretion Disk (SMBH)</option>
            </select>
        </div>
        <div class="control-group">
            <label for="ui-stars">Stars</label>
            <input type="number" id="ui-stars" class="tactical-input" min="1000" max="200000" step="1000" value="10000">
        </div>
        <div class="control-group">
            <div class="label-row">
                <label for="ui-gravity">Gravity</label>
                <span id="ui-gravity-value" class="slider-value">1.0</span>
            </div>
            <input type="range" id="ui-gravity" min="0.1" max="10.0" step="0.1" value="1.0">
        </div>
        <div class="control-group">
            <div class="label-row">
                <label for="ui-dark-matter">Dark Matter</label>
                <span id="ui-dark-matter-value" class="slider-value">0.0</span>
            </div>
            <input type="range" id="ui-dark-matter" min="0.0" max="1000.0" step="10.0" value="0.0">
        </div>
        <div class="control-group">
            <label>&nbsp;</label>
            <button id="ui-pause" class="tactical-button">Pause</button>
        </div>

        <div class="control-group">
            <label>&nbsp;</label>
            <button id="ui-restart" class="tactical-button">Restart</button>
        </div>
        <div class="control-group">
            <label>&nbsp;</label>
            <button id="ui-toggle-energy" class="tactical-button">ΔE Panel</button>
        </div>
        <div class="control-group back-button">
            <label>&nbsp;</label>
            <a href="index.html" class="tactical-button">Home</a>
        </div>
    </nav>

    <canvas id="bg-canvas"></canvas>
    <canvas id="sim-canvas"></canvas>

    <!-- Telemetry Pill -->
    <div id="telemetry-pill" class="tactical-glass">
        <h1>N-Body Simulation</h1>
        <div class="telemetry-row">
            <span class="telemetry-label">FPS</span>
            <span id="tel-fps" class="telemetry-value">--</span>
        </div>
        <div class="telemetry-row">
            <span class="telemetry-label">INTERACTIONS/S</span>
            <span id="tel-interactions" class="telemetry-value">--</span>
        </div>
        <div class="telemetry-row gflops-row" style="display: none;">
            <span class="telemetry-label">EST. GFLOPS</span>
            <span id="tel-gflops" class="telemetry-value">--</span>
        </div>
        <div class="telemetry-row gpu-row" style="display: none;">
            <span class="telemetry-label">GPU DISPATCH</span>
            <span id="tel-gpu-dispatch" class="telemetry-value">-- ms</span>
        </div>
        <div class="telemetry-row gpu-row" style="display: none;">
            <span class="telemetry-label">GPU MEMORY</span>
            <span id="tel-gpu-mem" class="telemetry-value">-- MB</span>
        </div>
        <div class="telemetry-row worker-row" style="display: none;">
            <span class="telemetry-label">WORKER STEP</span>
            <span id="tel-worker-step" class="telemetry-value">-- ms</span>
        </div>
        <div id="sim-info">
            <a href="https://sajidahmed.co.uk" target="_blank" rel="noopener"><i class="kiwi-logo"></i></a>
            <a href="https://github.com/sahmed0/galaxy-n-body-simulation.git" target="_blank" rel="noopener"
                aria-label="GitHub"><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 16 16"
                    fill="currentColor" aria-hidden="true">
                    <path
                        d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z" />
                    </svg></a>
            <p>© Sajid Ahmed 2026</p>
        </div>
    </div>

    <script type="module" src="/src/simulation.ts"></script>
</body>

</html>
