name: Test

on:
  push:
    branches: ["main", "feat"]
  pull_request:
    branches: ["main"]

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # Guardrail: the suite finishes in well under a minute, so cap the job to
    # keep a stray hang from holding a runner (and a deploy) for hours.
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          check-latest: true
          cache: 'pnpm'

      - name: Install
        run: pnpm install

      - name: Run tests
        run: pnpm test

  e2e:
    runs-on: ubuntu-latest
    # Playwright builds the app, starts a preview server and drives Chromium, so it
    # needs more headroom than the unit suite - but still bounded to free the runner.
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          check-latest: true
          cache: 'pnpm'

      - name: Install
        run: pnpm install

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run e2e smoke tests
        run: pnpm e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
