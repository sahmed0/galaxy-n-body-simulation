name: Test

on:
  push:
    branches: ["main", "feat"]
  pull_request:
    branches: ["main"]

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # Guardrail: the suite finishes in well under a minute, so cap the job to
    # keep a stray hang from holding a runner (and a deploy) for hours.
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install
        run: pnpm install

      - name: Run tests
        run: pnpm test
